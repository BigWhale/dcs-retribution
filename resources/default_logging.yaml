# To override default logging behavior, copy this file to resources/logging.yaml
# and make changes. logging.yaml will take precedence over the default config if
# it exists, but is not tracked by git.
#
# See https://gist.github.com/kingspp/9451566a5555fb022215ca2b7b802f19 and
# https://docs.python.org/3/howto/logging.html for examples.
version: 1
formatters:
  default:
    format: "%(asctime)s :: %(name)s :: %(levelname)s :: %(message)s"
handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: default
    stream: ext://sys.stderr
  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: default
    filename: logs/retribution.log
    maxBytes: 5242880
    backupCount: 1
    encoding: utf8
  in_memory:
    class: qt_ui.logging_handler.HookableInMemoryHandler
    level: DEBUG
    formatter: default
root:
  level: DEBUG
  handlers: [console, file, in_memory]
loggers:
  uvicorn.access:
    # uvicorn.access logs every HTTP request and its result. It's useful while
    # debugging that interface, but otherwise is very noisy, so by default is
    # only logged to the file. To include this in the console, add console to
    # the list of handlers, or set propagate to true, which will also log to the
    # UI's log window.
    handlers: [file]
    propagate: false
  uvicorn.error:
    level: INFO
    propagate: true
  # The loggers below are named here so that dictConfig does not disable them:
  # their modules create them on import, before logging is configured.
  game.companionlink:
    # The link to DCS Companion: state changes and failures. Its debug lines
    # repeat on every retry (every 5 s while the companion is away).
    level: INFO
  qt_ui.companionlinkcontroller:
    # One line per companion snapshot (each minute).
    level: INFO
  qt_ui.flightlauncher:
    # A few lines per flight launched into the live mission, and its failures.
    level: INFO
  httpcore:
    # Logs every connection step at debug: eight lines per companion retry.
    level: INFO
  httpx:
    # Logs every request at info, a companion retry every 5 s among them.
    level: WARNING
